# ============================================
# values.yaml — Valores por defecto del chart
# Sobreescribir con: helm install -f values-prod.yaml
# ============================================

# ── Configuración global ──────────────────────────────────
global:
  namespace: devops-portfolio
  environment: production

# ── Base de datos ─────────────────────────────────────────
postgres:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  credentials:
    database: notesdb
    user: postgres
    password: devops123    # solo laboratorio local; producción usa Secret externo
    secretName: postgres-secret
    createSecret: true
  storage:
    size: 1Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# ── Backend Flask ─────────────────────────────────────────
backend:
  image:
    repository: TU_USUARIO/devops-portfolio
    tag: "latest"
    pullPolicy: Always
  replicas: 2
  port: 5000
  env:
    APP_ENV: production
    APP_VERSION: "1.0.0"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# ── Frontend Nginx ────────────────────────────────────────
frontend:
  image:
    repository: TU_USUARIO/devops-frontend
    tag: "latest"
    pullPolicy: Always
  replicas: 2
  port: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# ── Ingress ───────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: devops-portfolio.local
  annotations:
    # No se usa rewrite-target: /api y /health coinciden con las rutas
    # reales del backend y deben conservarse al reenviar la solicitud.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    # HTTP no sirve operaciones: ingress-nginx responde 308. Como el puerto
    # HTTPS externo de k3d es 18443, se prueba HTTPS con URL explícita; no se
    # usa -L ni se supone que el Location estándar al puerto 443 sea usable.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  # El certificado de laboratorio y el Secret los prepara deploy.sh.
  # TLS termina en el Ingress; las comunicaciones internas no cambian.
  tls:
    enabled: true
    secretName: devops-portfolio-tls

# ── Monitoreo (opcional) ──────────────────────────────────
monitoring:
  enabled: false
  prometheusPort: 9090
